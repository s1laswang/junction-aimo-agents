# Buyer mandate / purchasing policy for a Tampere school kitchen (demo customer).
# Pupils with milk and nut allergies: allergen rules are hard blocks, unknown is never safe.
policy_id: school-tampere
version: "1.2.0"
effective_from: "2026-08-01"
customer:
  id: school-tampere
  name: Tampere Hervanta School Kitchen
  segment: school
  description: Central kitchen, 650 lunches a day; milk-free and nut-free by policy.

approver_roles: [kitchen_manager]
override_roles: [catering_director]
approvers:
  - {id: liisa@school-tampere.example, name: Liisa Korhonen, role: kitchen_manager}
  - {id: jari@school-tampere.example, name: Jari Nieminen, role: catering_director}

agents:
  - agent_id: school-tampere/buyer-1
    label: Gemini purchasing agent
    scopes: [catalog:read, quote:create, order:submit]

# Customer profile: the usual products (demo assumption). A line is "preferred" ONLY if listed here.
# 470889 has structured FREE_FROM data for milk and nuts. The earlier 472833 (Fazer Aito oat drink) has NO
# structured milk/nut data, so under this very policy (unknown = reject) the usual product could never be ordered.
preferred_products:
  - {product_id: "470889", label: Oatly Oat Drink Whole 1 L (milk and nut free per supplier data)}
approved_alternatives: []

standing_orders:
  - id: oat_drink
    label: oat drink
    keywords: [oat, kaura, havre]
    weekly_qty: 400
    unit: L
  - id: potatoes
    label: potatoes
    keywords: [potato, peruna, potatis]
    weekly_qty: 300
    unit: KG

rules:
  - id: mandate_scope
    type: scope
    required_scopes: [order:submit]

  - id: quote_freshness
    type: quote_freshness

  - id: spend
    type: spend_threshold
    auto_max: 300
    approval_max: 3000
    approver_role: kitchen_manager

  - id: weekly_budget
    type: period_spend
    period_days: 7
    limit: 4000
    outcome: needs_approval
    approver_role: kitchen_manager

  - id: substitution
    type: substitution
    require_claims: true
    # any substitution needs the kitchen manager
    tiers: {preferred: allow, best: needs_approval, better: needs_approval, good: needs_approval, rejected: reject}
    outside_preference: needs_approval
    unverified: needs_approval    # missing tier, or a tier the profile/catalog cannot back
    # no usual product of this kind + catalog confirms an exact match for the request = a first purchase,
    # not a substitution (allergen, claim, spend and other rules still apply)
    new_product: allow
    approver_role: kitchen_manager

  - id: allergens
    type: allergen_block
    excluded: [milk, nuts]
    reason: pupils with milk and nut allergies
    on_contains: reject
    on_may_contain: reject
    on_unknown: reject            # no allergen data -> the line must not be ordered
    approver_role: kitchen_manager

  - id: delivery
    type: delivery

  - id: quantity_drift
    type: quantity_drift
    max_factor: 3
    approver_role: kitchen_manager

  - id: split_order
    type: split_order
    window_days: 7                # same product, standing-order product or category, placed without a human
    max_factor: 1                 # together more than the spend rule's auto_max -> a human approves
    near_limit_share: 0.6         # orders with no line detail in the log count when they were >= 60% of auto_max
    approver_role: kitchen_manager

  - id: price_jump
    type: price_jump
    max_increase_pct: 15          # unit price more than 15% above the last price paid for the same product
    lookback_days: 90
    approver_role: kitchen_manager

  - id: injection
    type: injection
    approver_role: kitchen_manager
