# Buyer mandate / purchasing policy for Hotel Aurora Helsinki (demo customer).
# Evaluated by aimo.trust.policy.evaluate() on every quote before an order is placed.
# Outcome = strictest rule: reject > needs_approval > auto_approve.
policy_id: hotel-aurora
version: "1.2.0"
effective_from: "2026-11-01"
customer:
  id: hotel-aurora
  name: Hotel Aurora Helsinki
  segment: hotel
  description: 180-room city hotel; breakfast buffet and restaurant.

# Ordered by authority, most specific first. Approval needs one of the roles the decision names.
approver_roles: [procurement_manager]
override_roles: [general_manager]   # may approve anything that is not a hard reject
approvers:
  - {id: anna@hotel-aurora.example, name: Anna Virtanen, role: procurement_manager}
  - {id: mikko@hotel-aurora.example, name: Mikko Laine, role: general_manager}

agents:
  - agent_id: hotel-aurora/buyer-1
    label: Gemini purchasing agent
    scopes: [catalog:read, quote:create, order:submit]
  - agent_id: hotel-aurora/planner-1
    label: Menu planning assistant (may quote, may not order)
    scopes: [catalog:read, quote:create]

# Customer profile: the usual products. A line is "preferred" ONLY if its product_id is listed here;
# the caller's tier is never trusted (see substitution rule). Source: buyer profile / PLAN demo script.
preferred_products:
  - {product_id: "463038", label: Valio Eila semi-skimmed lactose-free milk drink 10 L Novobox (dispenser)}
# Swaps the customer has approved in advance, with their verified tier.
approved_alternatives:
  - {product_id: "464306", tier: best, for: "463038", label: Valio Eila semi-skimmed lactose-free milk drink 1 L (same product, smaller pack)}

# Standing-order baselines used by quantity_drift (typical weekly volume).
standing_orders:
  - id: milk
    label: milk
    keywords: [milk, maito, mjölk]
    weekly_qty: 300
    unit: L
  - id: butter
    label: butter
    keywords: [butter, voi, smör]
    weekly_qty: 25
    unit: KG

rules:
  - id: mandate_scope
    type: scope
    required_scopes: [order:submit]

  - id: quote_freshness
    type: quote_freshness

  - id: spend
    type: spend_threshold
    auto_max: 500
    approval_max: 5000
    approver_role: procurement_manager

  - id: weekly_budget
    type: period_spend
    period_days: 7
    limit: 8000
    outcome: needs_approval
    approver_role: procurement_manager

  - id: category_scope
    type: category_scope
    # Category names are not in the Valio Aimo data set (only codes). Groups below are inferred from
    # sampled product names per code prefix. UNVERIFIED against Valio's category tree.
    # v1.2: the kitchen also buys dry goods (flour, pasta, beans: 21) and frozen food incl. frozen bread (41).
    # Still out: coffee/spices (22), meat and fish (18), equipment (20), hygiene and disposables (63/64),
    # confectionery (52), drinks (84/85), office (90). Groups inferred from product names.
    allowed:
      - {prefix: "10", label: dairy and chilled}
      - {prefix: "11", label: fresh bakery}
      - {prefix: "17", label: chilled food and produce}
      - {prefix: "21", label: dry goods}
      - {prefix: "41", label: frozen food}
    on_violation: needs_approval
    on_unknown: needs_approval
    approver_role: procurement_manager

  - id: substitution
    type: substitution
    require_claims: true          # a substitute must keep every required claim (e.g. FREE_FROM_LACTOSE)
    tiers: {preferred: allow, best: allow, better: needs_approval, good: needs_approval, rejected: reject}
    outside_preference: needs_approval
    unverified: needs_approval    # missing tier, or a tier the profile/catalog cannot back
    # no usual product of this kind + catalog confirms an exact match for the request = a first purchase,
    # not a substitution (allergen, claim, spend and other rules still apply)
    new_product: allow
    # verified-best or pre-approved alternative lines under this amount are swapped without asking
    auto_approve_alternatives_below_eur: 50
    approver_role: procurement_manager

  - id: allergens
    type: allergen_block
    excluded: []                  # plus any excluded_allergens the buyer put in the Need
    on_contains: reject
    on_may_contain: reject
    on_unknown: needs_approval
    approver_role: procurement_manager

  - id: delivery
    type: delivery

  - id: quantity_drift
    type: quantity_drift
    max_factor: 3
    approver_role: procurement_manager

  - id: split_order
    type: split_order
    window_days: 7                # same product, standing-order product or category, placed without a human
    max_factor: 1                 # together more than the spend rule's auto_max -> a human approves
    near_limit_share: 0.6         # orders with no line detail in the log count when they were >= 60% of auto_max
    approver_role: procurement_manager

  - id: price_jump
    type: price_jump
    max_increase_pct: 15          # unit price more than 15% above the last price paid for the same product
    lookback_days: 90
    approver_role: procurement_manager

  - id: injection
    type: injection
    approver_role: procurement_manager
