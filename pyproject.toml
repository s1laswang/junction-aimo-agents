[project]
name = "aimo-trusted-trade"
version = "0.1.0"
description = "Valio Aimo Trusted Trade Agents: open MCP/OpenAPI gateway, guardrails, signed audit, Gemini buyer agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "cryptography>=43",
  "mcp>=2.3,<3",  # speaks MCP spec 2026-07-28; see aimo/config.py MCP_SPEC_VERSION
  "google-genai>=1.0",
  "sse-starlette>=2.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
aimo = "aimo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aimo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
